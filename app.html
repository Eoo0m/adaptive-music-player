<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adaptive music player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000000'/><rect x='6' y='22' width='4' height='8' fill='%238a5a2b'/><rect x='7' y='2' width='2' height='2' fill='%2332d66b'/><rect x='6' y='4' width='4' height='2' fill='%2332d66b'/><rect x='5' y='6' width='6' height='3' fill='%2332d66b'/><rect x='4' y='9' width='8' height='3' fill='%2327bf58'/><rect x='3' y='12' width='10' height='4' fill='%2321ad4d'/><rect x='2' y='16' width='12' height='4' fill='%231b9b43'/><rect x='1' y='20' width='14' height='4' fill='%23168a39'/><rect x='22' y='22' width='4' height='8' fill='%238a5a2b'/><rect x='23' y='2' width='2' height='2' fill='%2332d66b'/><rect x='22' y='4' width='4' height='2' fill='%2332d66b'/><rect x='21' y='6' width='6' height='3' fill='%2332d66b'/><rect x='20' y='9' width='8' height='3' fill='%2327bf58'/><rect x='19' y='12' width='10' height='4' fill='%2321ad4d'/><rect x='18' y='16' width='12' height='4' fill='%231b9b43'/><rect x='17' y='20' width='14' height='4' fill='%23168a39'/></svg>" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div class="space-background"></div>
    <div class="stars" id="stars"></div>

    <!-- 로그인 선택 화면 -->
    <div class="login-screen" id="loginScreen">
        <svg class="login-logo" viewBox="0 0 32 32" width="64" height="64" aria-hidden="true">
            <rect x="6" y="22" width="4" height="8" fill="#8a5a2b"/>
            <rect x="7" y="2" width="2" height="2" fill="#32d66b"/>
            <rect x="6" y="4" width="4" height="2" fill="#32d66b"/>
            <rect x="5" y="6" width="6" height="3" fill="#32d66b"/>
            <rect x="4" y="9" width="8" height="3" fill="#27bf58"/>
            <rect x="3" y="12" width="10" height="4" fill="#21ad4d"/>
            <rect x="2" y="16" width="12" height="4" fill="#1b9b43"/>
            <rect x="1" y="20" width="14" height="4" fill="#168a39"/>
            <rect x="22" y="22" width="4" height="8" fill="#8a5a2b"/>
            <rect x="23" y="2" width="2" height="2" fill="#32d66b"/>
            <rect x="22" y="4" width="4" height="2" fill="#32d66b"/>
            <rect x="21" y="6" width="6" height="3" fill="#32d66b"/>
            <rect x="20" y="9" width="8" height="3" fill="#27bf58"/>
            <rect x="19" y="12" width="10" height="4" fill="#21ad4d"/>
            <rect x="18" y="16" width="12" height="4" fill="#1b9b43"/>
            <rect x="17" y="20" width="14" height="4" fill="#168a39"/>
        </svg>
        <h1 class="login-title">Dynplayer</h1>
        <button class="login-button" onclick="loginWithGoogle()">Google로 로그인</button>
        <button class="login-button login-button-spotify" onclick="loginWithSpotify()">Spotify로 로그인</button>
        <button class="login-button login-button-guest" onclick="continueAsGuest()">로그인 없이 이용하기</button>
    </div>

    <!-- 하단 탭바 (모바일) -->
    <nav class="bottom-tab hidden" id="bottomTab">
        <button class="bottom-tab-btn" id="btHome" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>홈</span>
        </button>
        <button class="bottom-tab-btn active" id="btSearch" onclick="switchTab('search')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>검색</span>
        </button>
        <button class="bottom-tab-btn" id="btFavorites" onclick="switchTab('favorites')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>찜</span>
        </button>
        <button class="bottom-tab-btn" id="btMap" onclick="switchTab('map')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="5" cy="6" r="2"/>
                <circle cx="19" cy="5" r="2"/>
                <circle cx="6" cy="19" r="2"/>
                <circle cx="19" cy="18" r="2"/>
                <line x1="7" y1="7" x2="10" y2="10"/>
                <line x1="17" y1="7" x2="14" y2="10"/>
                <line x1="7" y1="18" x2="10" y2="14"/>
                <line x1="17" y1="17" x2="14" y2="14"/>
            </svg>
            <span>지도</span>
        </button>
    </nav>

    <!-- 좌측 사이드 탭 -->
    <nav class="side-tab hidden" id="sideTab">
        <button class="side-tab-btn" id="tabHome" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </button>
        <button class="side-tab-btn active" id="tabSearch" onclick="switchTab('search')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
        <button class="side-tab-btn" id="tabFavorites" onclick="switchTab('favorites')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>
        <button class="side-tab-btn" id="tabMap" onclick="switchTab('map')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="5" cy="6" r="2"/>
                <circle cx="19" cy="5" r="2"/>
                <circle cx="6" cy="19" r="2"/>
                <circle cx="19" cy="18" r="2"/>
                <line x1="7" y1="7" x2="10" y2="10"/>
                <line x1="17" y1="7" x2="14" y2="10"/>
                <line x1="7" y1="18" x2="10" y2="14"/>
                <line x1="17" y1="17" x2="14" y2="14"/>
            </svg>
        </button>
    </nav>

    <div class="layout-toggle" id="layoutToggle" aria-label="보기 방식 선택"></div>

    <!-- 홈 피드 화면 -->
    <div class="home-feed-view hidden" id="homeFeedView">
        <!-- 플레이리스트 빌더 섹션 -->
        <div class="playlist-builder-section" id="playlistBuilderSection"></div>
        <!-- 기존 홈 피드 -->
        <div class="home-feed-list" id="homeFeedList"></div>
    </div>

    <!-- 취향 지도 화면 -->
    <div class="map-view hidden" id="mapView">
        <!-- 지도 검색 오버레이 -->
        <div class="map-search-overlay" id="mapSearchOverlay">
            <div class="map-search-bar">
                <input type="text" class="map-search-input" id="mapSearchInput" placeholder="곡 제목 또는 아티스트명 검색...">
                <button class="map-refresh-btn" id="mapRefreshBtn" title="찜 목록으로 지도 새로 고침">↺</button>
            </div>
            <div class="map-search-status" id="mapSearchStatus"></div>
            <div class="map-search-results" id="mapSearchResults"></div>
        </div>
        <div class="map-canvas-wrap" id="mapCanvasWrap">
            <canvas id="mapCanvas"></canvas>
        </div>
        <div id="mapTooltip" style="display:none;position:fixed;pointer-events:none;background:rgba(18,18,28,.92);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;font-size:12px;color:#fff;white-space:nowrap;backdrop-filter:blur(6px);z-index:100;max-width:240px;line-height:1.5;"></div>
        <div class="map-loading hidden" id="mapLoading">
            <div class="map-loading-spinner"></div>
            <p id="mapLoadingMsg">취향 지도를 그리는 중...</p>
        </div>
        <div class="map-empty hidden" id="mapEmpty">
            <p>취향 지도를 불러올 수 없습니다.</p>
        </div>
    </div>

    <!-- 찜 목록 화면 -->
    <div class="favorites-view hidden" id="favoritesView">
        <!-- 유저 프로필 카드 -->
        <div class="fav-profile-card" id="favProfileCard">
            <img class="fav-profile-img" id="favProfileImg" src="" alt="">
            <span class="fav-profile-name" id="favProfileName"></span>
        </div>
        <!-- 저장한 곡들 -->
        <div class="fav-songs-card">
            <h2 class="favorites-title">저장한 곡들</h2>
            <p class="favorites-guide">앨범 커버를 클릭해 추천을 받고, 더블클릭해 바로 재생해보세요.</p>
            <div class="favorites-list" id="favoritesList"></div>
        </div>
    </div>

    <a href="https://github.com/Eoo0m/adaptive-music-player-backend" target="_blank" class="github-link">
        <svg class="github-logo" viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54
               2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
               0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94
               -.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53
               .63-.01 1.08.58 1.23.82.72 1.21
               1.87.87 2.33.66.07-.52.28-.87.51-1.07
               -1.78-.2-3.64-.89-3.64-3.95
               0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12
               0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0
               1.36.09 2 .27 1.53-1.04 2.2-.82
               2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
               1.27.82 2.15 0 3.07-1.87 3.75-3.65
               3.95.29.25.54.73.54 1.48 0 1.07-.01
               1.93-.01 2.2 0 .21.15.46.55.38A8.013
               8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </svg>
        Eoo0m
    </a>

    <div class="search-interface hidden" id="initialSongInput">
        <div class="search-section">
            <div class="search-row">
                <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleSearchMode()">트랙</button>
                <input type="text" class="search-input" id="searchInput"
                    placeholder="노래 제목을 입력하세요 (예: Shape of You, Ed Sheeran)">
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <div class="track-info hidden" id="trackInfo"></div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/recommend.js"></script>
</body>

</html>
