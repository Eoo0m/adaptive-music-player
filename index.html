<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adaptive music player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000000'/><rect x='5' y='4' width='1' height='1' fill='%23ffffff'/><rect x='6' y='3' width='4' height='1' fill='%23ffffff'/><rect x='10' y='4' width='1' height='1' fill='%23ffffff'/><rect x='4' y='5' width='1' height='2' fill='%23ffffff'/><rect x='11' y='5' width='1' height='2' fill='%23ffffff'/><rect x='2' y='7' width='4' height='6' fill='%23ffffff'/><rect x='3' y='8' width='2' height='4' fill='%23cccccc'/><rect x='10' y='7' width='4' height='6' fill='%23ffffff'/><rect x='11' y='8' width='2' height='4' fill='%23cccccc'/></svg>" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div class="space-background"></div>
    <div class="stars" id="stars"></div>

    <a href="https://github.com/Eoo0m/adaptive-music-player-backend" target="_blank" class="github-link">
        <svg class="github-logo" viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54
               2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
               0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94
               -.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53
               .63-.01 1.08.58 1.23.82.72 1.21
               1.87.87 2.33.66.07-.52.28-.87.51-1.07
               -1.78-.2-3.64-.89-3.64-3.95
               0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12
               0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0
               1.36.09 2 .27 1.53-1.04 2.2-.82
               2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
               1.27.82 2.15 0 3.07-1.87 3.75-3.65
               3.95.29.25.54.73.54 1.48 0 1.07-.01
               1.93-.01 2.2 0 .21.15.46.55.38A8.013
               8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </svg>
        Eoo0m
    </a>

    <div class="search-interface" id="initialSongInput">
        <div class="search-section">
            <div class="search-row">
                <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleSearchMode()">트랙</button>
                <input type="text" class="search-input" id="searchInput"
                    placeholder="노래 제목을 입력하세요 (예: Shape of You, Ed Sheeran)">
                <button class="search-button" onclick="doSearch()" id="searchBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <div class="track-info hidden" id="trackInfo"></div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/recommend.js"></script>
</body>

</html>
