<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adaptive music player</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none
        }

        .login-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff
        }

        .login-button {
            background: #1db954;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            margin-top: 20px
        }

        .login-button:hover {
            background: #1ed760
        }

        .track-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            font-size: 14px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px
        }

        .album-cover {
            width: 300px;
            height: 300px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .6), inset 0 0 20px rgba(0, 0, 0, .2);
            object-fit: cover;
            animation: fadeIn .5s ease-in-out;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            filter: brightness(0.95) contrast(0.92) saturate(0.88);
            opacity: 0.92;
            transition: all 0.3s ease;
            cursor: pointer;
            transition: transform .2s ease, opacity .2s ease
        }

        .album-cover:hover {
            transform: scale(1.02);
            opacity: 1
        }

        .album-cover.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .album-cover[src=""],
        .album-cover:not([src]) {
            display: none
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(.95)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 5px
        }

        .artist-name {
            opacity: .8;
            font-size: 12px
        }

        .space-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: -2
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -1
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite
        }

        .star.small {
            width: 1px;
            height: 1px
        }

        .star.medium {
            width: 2px;
            height: 2px
        }

        .star.large {
            width: 3px;
            height: 3px
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .3
            }

            50% {
                opacity: 1
            }
        }

        .dust {
            position: absolute;
            background: rgba(255, 255, 255, .1);
            border-radius: 50%;
            animation: float 10s infinite linear
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0)
            }

            100% {
                transform: translateY(-100px) translateX(50px)
            }
        }

        /* ✅ 드래그용 래퍼: transform 대신 left/top으로 이동 */
        .ipod-wrapper {
            position: fixed;
            /* 화면 위 자유롭게 이동 */
            left: calc(50% - 60px);
            top: calc(50% + 100px);
            /* 중앙보다 아래로 */
            width: 120px;
            height: 120px;
            z-index: 1;
            cursor: grab;
            /* 드래그 중 포인터 시각 */
        }

        .ipod-wrapper.dragging {
            cursor: grabbing
        }

        .ipod-container {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #d5d5d5 0%, #b8b8b8 50%, #a8a8a8 100%);
            border-radius: 6px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -1px 0 rgba(0, 0, 0, .3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatTilt 4s ease-in-out infinite;
            user-select: none
        }

        .ipod-container.playing {
            animation: playingPulse 2s ease-in-out infinite
        }


        @keyframes playingPulse {

            0%,
            100% {
                transform: scale(1) rotate(0);
                box-shadow: 0 5px 12px rgba(0, 0, 0, .3), 0 0 0 rgba(29, 185, 84, 0)
            }

            50% {
                transform: scale(1.05) rotate(1deg);
                box-shadow: 0 8px 20px rgba(0, 0, 0, .4), 0 0 20px rgba(29, 185, 84, .3)
            }
        }

        @keyframes floatTilt {
            0% {
                transform: rotate(0) translateY(0)
            }

            25% {
                transform: rotate(2deg) translateY(-3px)
            }

            50% {
                transform: rotate(-1deg) translateY(-6px)
            }

            75% {
                transform: rotate(1.5deg) translateY(-3px)
            }

            100% {
                transform: rotate(0) translateY(0)
            }
        }

        .clickwheel {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 70%, #000 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, .8), 0 2px 3px rgba(0, 0, 0, .4)
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #e5e5e5 0%, #c8c8c8 50%, #b8b8b8 100%);
            border: 1px solid #999;
            border-radius: 50%;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -1px 0 rgba(0, 0, 0, .1);
            cursor: pointer;
            transition: transform .1s ease
        }

        .control {
            position: absolute;
            color: #ccc;
            font-size: 12px;
            font-weight: 400;
            user-select: none;
            cursor: pointer;
            transition: .2s;
            font-family: Arial, sans-serif
        }

        .control:hover {
            color: #fff
        }

        .control.active {
            color: #1db954 !important
        }

        .volume-up {
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px
        }

        .volume-down {
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px
        }

        .prev {
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: bold
        }

        .next {
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: bold
        }

        .play-pause {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2d2d2d;
            font-size: 18px;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
            font-family: Arial, sans-serif
        }

        .hidden {
            display: none !important
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 20px
        }

        .github-link {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, .1);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            transition: .3s;
            border: 1px solid rgba(255, 255, 255, .2);
            backdrop-filter: blur(10px)
        }

        .github-link:hover {
            background: rgba(255, 255, 255, .2);
            transform: translateY(-2px);
            color: #fff
        }

        .search-interface {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .9);
            padding: 20px 25px;
            border-radius: 15px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(10px)
        }

        .search-interface h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .search-section {
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            margin: 0 0 8px 0;
            border: 2px solid rgba(255, 255, 255, .3);
            border-radius: 20px;
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: .3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #1db954;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, .5);
            font-size: 12px;
        }

        .search-input:focus {
            border-color: #1db954
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, .6)
        }

        .search-button {
            background: #1db954;
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            margin-bottom: 5px;
        }

        .search-button:hover {
            background: #1ed760
        }

        .search-button:disabled {
            background: #666;
            cursor: not-allowed
        }

        .recommendation-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left
        }

        .recommendation-item {
            background: rgba(255, 255, 255, .1);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
            border: 1px solid rgba(255, 255, 255, .1);
            display: flex;
            align-items: center;
            gap: 12px
        }

        .recommendation-item:hover {
            background: rgba(255, 255, 255, .2)
        }

        .recommendation-item.selected {
            background: rgba(29, 185, 84, .3);
            border-color: #1db954
        }

        .rec-album-cover {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            background: rgba(255, 255, 255, .05);
            flex-shrink: 0;
            display: block
        }

        .rec-album-cover[src=""],
        .rec-album-cover:not([src]) {
            display: none
        }

        .rec-info {
            flex: 1;
            min-width: 0
        }

        .rec-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .rec-artist {
            color: rgba(255, 255, 255, .8);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }
    </style>
</head>

<body>
    <div class="space-background"></div>
    <div class="stars" id="stars"></div>

    <a href="https://github.com/Eoo0m" target="_blank" class="github-link">
        <svg class="github-logo" viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 
               2.29 6.53 5.47 7.59.4.07.55-.17.55-.38

               0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 
               1.36.09 2 .27 1.53-1.04 2.2-.82

        </svg>
        Eoo0m
    </a>

    <div class="login-screen" id="loginScreen">
        <h1>🎵 adaptive music player</h1>
        <p>동적인 음악 추천을 즐겨보세요</p>
        <button class="login-button" onclick="login()">Spotify로 로그인</button>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="search-interface hidden" id="initialSongInput">
        <h2>🎵 노래 검색</h2>

        <!-- 제목 검색 -->
        <div class="search-section">
            <input type="text" class="search-input" id="initialSongTitle" placeholder="노래 제목을 입력하세요 (예: Shape of You, Ed Sheeran)">
            <button class="search-button" onclick="searchInitialSongs()" id="initialSearchBtn">검색</button>
            <div id="initialSearchResults"></div>
        </div>

        <!-- 키워드 검색 -->
        <div class="search-section" style="margin-top: 15px;">
            <input type="text" class="search-input" id="keywordSearchInput" placeholder="키워드를 입력하세요 (예: 공부할 때 듣는 재즈, 드라이브 팝송)">
            <button class="search-button" onclick="searchByKeyword()" id="keywordSearchBtn">검색</button>
            <div id="keywordSearchResults"></div>
        </div>
    </div>

    <div class="track-info hidden" id="trackInfo" onclick="showSearchInterface()" style="cursor: pointer;">
        <img class="album-cover" id="albumCover" src="" alt="Album Cover">
        <div>
            <div class="track-name" id="trackName">노래 제목</div>
            <div class="artist-name" id="artistName">아티스트</div>
        </div>
    </div>

    <!-- ✅ 드래그 가능한 래퍼 -->
    <div id="ipodWrapper" class="ipod-wrapper">
        <div class="ipod-container" id="ipodContainer">
            <div class="clickwheel">
                <div class="control volume-up" id="volumeUp">+</div>
                <div class="control volume-down" id="volumeDown">−</div>
                <div class="control prev" id="prevBtn">‹‹</div>
                <div class="control next" id="nextBtn">››</div>
                <div class="center-button" id="centerButton">
                    <div class="play-pause" id="playPauseIcon">▶</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        // ===== Global =====
        let player, is_paused = true, current_track = null, device_id = null;
        let access_token = null, refresh_token = null;

        let playlist = [];                // 현재 플레이리스트
        let currentTrackIndex = 0;        // 재생 인덱스

        // ===== Playback Tracking =====
        let trackStartTime = null;        // 현재 트랙 시작 시간
        let trackDuration = null;         // 현재 트랙 총 길이(ms)
        let lastPlayedTrack = null;       // 이전에 재생한 트랙

        // ===== Listening Log =====
        let sessionId = null;             // 세션 ID (로그인 시 생성)

        function generateSessionId() {
            return `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }

        async function logListeningData(trackData) {
            if (!trackData || !trackData.track_name || !trackData.artist_name) {
                console.warn('⚠️ Skipping log: missing track data');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/log-listening`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...trackData,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    console.error('❌ Failed to log listening data:', response.status);
                } else {
                    console.log('✅ Listening data logged successfully');
                }
            } catch (e) {
                console.error('❌ Error logging listening data:', e);
            }
        }

        // ===== Auth =====
        function initializeAuth() {
            const hashParams = new URLSearchParams(window.location.hash.substr(1));
            const storedToken = localStorage.getItem('spotify_access_token');
            const storedRefresh = localStorage.getItem('spotify_refresh_token');
            access_token = hashParams.get('access_token') || storedToken;
            refresh_token = hashParams.get('refresh_token') || storedRefresh;

            if (hashParams.get('error')) {
                document.getElementById('errorMessage').textContent = '로그인에 실패했습니다: ' + hashParams.get('error');
                return;
            }
            if (access_token) {
                localStorage.setItem('spotify_access_token', access_token);
                if (refresh_token) localStorage.setItem('spotify_refresh_token', refresh_token);

                // 세션 ID 생성
                sessionId = generateSessionId();
                console.log('🎵 Session started:', sessionId);

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('trackInfo').classList.remove('hidden');
                document.getElementById('initialSongInput').classList.remove('hidden');

                // 처음 로그인 시 검색창만 보이고 앨범은 숨김
                const albumCover = document.getElementById('albumCover');
                if (albumCover && !albumCover.src) {
                    albumCover.classList.add('hidden');
                }

                window.location.hash = '';
            }
        }
        const API_BASE_URL = 'https://api.dynplayer.win';
        function login() { window.location.href = `${API_BASE_URL}/login`; }

        // ===== Spotify SDK =====
        window.onSpotifyWebPlaybackSDKReady = () => { if (access_token) initializeSpotifyPlayer(); };

        function initializeSpotifyPlayer() {
            if (!access_token) return;

            player = new Spotify.Player({
                name: 'Spotify iPod Web Player',
                getOAuthToken: cb => cb(access_token),
                volume: 0.5
            });

            player.addListener('initialization_error', ({ message }) => console.error('초기화 오류:', message));
            player.addListener('authentication_error', ({ message }) => { console.error('인증 오류:', message); refreshAccessToken(); });
            player.addListener('account_error', ({ message }) => { console.error('계정 오류:', message); alert('Spotify Premium 계정이 필요합니다.'); });
            player.addListener('playback_error', ({ message }) => console.error('재생 오류:', message));

            player.addListener('player_state_changed', (state) => {
                if (!state) return;
                const previousTrack = current_track;
                current_track = state.track_window.current_track;
                is_paused = state.paused;

                // 트랙이 변경될 때 이전 트랙의 듣기 기록 저장
                if (previousTrack?.id && previousTrack?.id !== current_track?.id) {
                    lastPlayedTrack = previousTrack;
                    recordTrackCompletion('auto', state.position);
                }
                if (previousTrack?.id !== current_track?.id && current_track) {
                    trackStartTime = Date.now();
                    trackDuration = current_track.duration_ms;
                }

                // 자동 종료 감지 → 다음 곡 재생 (이전 트랙이 있을 때만)
                if (state.position === 0 && state.paused && current_track && previousTrack?.id) {
                    setTimeout(() => playNext(), 600);
                } else {
                    updateTrackInfo(); updatePlayPauseIcon();
                }
            });

            player.addListener('ready', ({ device_id: ready_device_id }) => {
                console.log('🎵 Spotify Player Ready with Device ID', ready_device_id);
                device_id = ready_device_id;
                transferPlaybackToDevice(device_id);
                if (playlist.length > 0) setTimeout(() => playTrackAtIndex(0), 1200);
            });

            player.connect();
        }

        async function transferPlaybackToDevice(device_id) {
            try {
                await fetch('https://api.spotify.com/v1/me/player', {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_ids: [device_id], play: false })
                });
            } catch (e) { console.error('재생 장치 전환 오류:', e); }
        }

        // ===== Debug =====
        function fmtSeed(seed) {
            if (!seed) return 'Unknown seed';
            const title = seed.name || seed.track || 'Unknown';
            const artist = (seed.artists ? seed.artists.map(a => a.name).join(', ') : seed.artist) || 'Unknown Artist';
            return `${title} — ${artist}`;
        }
        function fmtRecItem(trackObj, idx) {
            const t = trackObj.spotify_track || trackObj.track || trackObj;
            const name = t?.name || trackObj.track || 'Unknown Track';
            const artists = (t?.artists ? t.artists.map(a => a.name).join(', ') : trackObj.artist) || 'Unknown Artist';
            const sim = (trackObj.similarity ?? t?.similarity ?? null);
            const simTxt = (typeof sim === 'number') ? `  [sim=${(sim * 100).toFixed(1)}%]` : '';
            return `${String(idx + 1).padStart(2, '0')}. ${name} — ${artists}${simTxt}`;
        }
        function logRecommendationList(kind, seedTrack, list) {
            console.log(`\n📦 ${kind} RECS (n=${list.length})  |  seed: ${fmtSeed(seedTrack)}`);
            for (let i = 0; i < list.length; i++) console.log('   ' + fmtRecItem(list[i], i));
            console.log('—'.repeat(48) + '\n');
        }

        // ===== Helpers =====
        function getSeed() {
            if (current_track?.id) return current_track;
            if (lastPlayedTrack?.id) return lastPlayedTrack;
            const last = playlist[playlist.length - 1];
            const t = last ? (last.spotify_track || last.track || last) : null;
            return t || null;
        }

        // ===== Playback / UI =====
        async function playTrackAtIndex(index) {
            if (!playlist[index]) return;
            const track = playlist[index];
            const uri = track.uri || track.spotify_track?.uri || track.track?.uri;
            if (!uri || !device_id) return;

            const t = track.spotify_track || track.track || track;
            const name = t.name || track.track || 'Unknown Track';
            const artists = t.artists ? t.artists.map(a => a.name).join(', ') : (track.artist || 'Unknown Artist');
            const similarityText = (typeof track.similarity === 'number') ? ` (${(track.similarity * 100).toFixed(1)}% similar)` : '';
            console.log(`▶️ [${index + 1}/${playlist.length}] ${name} - ${artists}${similarityText}`);

            try {
                const response = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${device_id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uris: [uri] })
                });

                // 403 에러 발생 시 1초 후 재시도
                if (response.status === 403) {
                    console.warn('플레이어 준비 중... 1초 후 재시도');
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${device_id}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uris: [uri] })
                    });
                }
            } catch (e) { console.error('트랙 재생 오류:', e); }
        }
        async function playSpotifyTrack(uri) {
            if (!device_id || !uri) return;
            try {
                await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${device_id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uris: [uri] })
                });
            } catch (e) { console.error('Spotify track playback error:', e); }
        }

        function recordTrackCompletion(reason = 'auto', currentPosition = 0) {
            if (current_track && trackStartTime && trackDuration) {
                let ratio;
                let playedMs;
                if (reason === 'manual' && currentPosition > 0) {
                    ratio = (currentPosition / trackDuration) * 100;
                    playedMs = currentPosition;
                } else {
                    playedMs = Date.now() - trackStartTime;
                    ratio = Math.min((playedMs / trackDuration) * 100, 100);
                }

                // ✅ Supabase에 듣는 기록 저장
                const currentPlaylistTrack = playlist[currentTrackIndex];
                const similarityScore = currentPlaylistTrack?.similarity || null;

                console.log(`📝 Logging: ${current_track.name} - ${ratio.toFixed(1)}% completed`);

                logListeningData({
                    track_name: current_track.name,
                    artist_name: current_track.artists?.map(a => a.name).join(', ') || 'Unknown',
                    album_name: current_track.album?.name || null,
                    spotify_uri: current_track.uri || null,
                    spotify_track_id: current_track.id || null,
                    duration_ms: trackDuration,
                    played_duration_ms: Math.min(playedMs, trackDuration),
                    completion_percentage: Math.min(ratio, 100).toFixed(2),
                    recommendation_mode: 'similar',
                    similarity_score: similarityScore
                }).catch(err => console.error('Failed to log listening data:', err));
            }
        }


        // ===== 다음 곡 재생 =====
        async function playNext() {
            // 1) 플레이리스트에 다음 곡이 있으면 재생
            if (playlist.length > 0 && currentTrackIndex < playlist.length - 1) {
                currentTrackIndex++;
                await playTrackAtIndex(currentTrackIndex);
                return;
            }

            // 2) 플레이리스트 끝 → 현재 곡 기반으로 새 추천 받기
            if (!current_track) {
                console.warn('⚠️ No current track to base recommendations on');
                return;
            }

            try {
                console.log('🎵 Playlist ended, fetching new recommendations...');
                console.log(`🎵 Current playing track: ${current_track.name} by ${current_track.artists?.[0]?.name}`);

                // 현재 재생 중인 Spotify 트랙 ID를 track_key로 사용
                let trackKey = current_track.id;

                // track_key가 없으면 제목으로 검색
                if (!trackKey) {
                    const query = `${current_track.name} ${current_track.artists?.[0]?.name || ''}`.trim();
                    console.log(`🔍 Searching for track_key: "${query}"`);

                    const searchResp = await fetch(`${API_BASE_URL}/search-songs`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });

                    if (!searchResp.ok) throw new Error('Search failed');

                    const searchData = await searchResp.json();
                    if (!searchData.results || searchData.results.length === 0) {
                        throw new Error('Track not found in database');
                    }

                    trackKey = searchData.results[0].track_key;
                    console.log(`🔑 Found track_key from search: ${trackKey}`);
                } else {
                    console.log(`🔑 Using Spotify track ID as track_key: ${trackKey}`);
                }

                // track_key로 추천 받기
                const recResp = await fetch(`${API_BASE_URL}/recommend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ track_key: trackKey, num_recommendations: 30 })
                });

                if (!recResp.ok) throw new Error('Recommendation failed');

                const recData = await recResp.json();
                if (!recData.recommendations || recData.recommendations.length === 0) {
                    throw new Error('No recommendations found');
                }

                // Spotify 매칭
                const spotifyResp = await fetch(`${API_BASE_URL}/find-spotify-tracks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tracks: recData.recommendations, access_token })
                });

                if (!spotifyResp.ok) throw new Error('Spotify matching failed');

                const spotifyData = await spotifyResp.json();
                if (!spotifyData.spotify_tracks || spotifyData.spotify_tracks.length === 0) {
                    throw new Error('No Spotify tracks found');
                }

                // 새 플레이리스트 설정
                playlist = spotifyData.spotify_tracks.slice(0, 10);
                currentTrackIndex = 0;

                console.log(`✅ New playlist loaded: ${playlist.length} tracks`);
                await playSpotifyTrack(playlist[0].uri || playlist[0].spotify_track?.uri);

            } catch (e) {
                console.error('⚠️ Failed to fetch next recommendations:', e);
                alert('다음 추천곡을 가져올 수 없습니다.');
            }
        }

        async function playPrevious() {
            if (playlist.length === 0) return;
            currentTrackIndex = currentTrackIndex === 0 ? playlist.length - 1 : currentTrackIndex - 1;
            await playTrackAtIndex(currentTrackIndex);
        }

        async function refreshAccessToken() {
            if (!refresh_token) { logout(); return; }
            try {
                const r = await fetch('/refresh_token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token }) });
                const d = await r.json();
                if (d.access_token) {
                    access_token = d.access_token; localStorage.setItem('spotify_access_token', access_token);
                    if (d.refresh_token) { refresh_token = d.refresh_token; localStorage.setItem('spotify_refresh_token', refresh_token); }
                } else { logout(); }
            } catch (e) { console.error('토큰 새로고침 오류:', e); logout(); }
        }
        function logout() {
            localStorage.removeItem('spotify_access_token');
            localStorage.removeItem('spotify_refresh_token');
            access_token = null; refresh_token = null;
            if (player) player.disconnect();
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('trackInfo').classList.add('hidden');
        }

        // ===== UI =====
        function updateTrackInfo() {
            if (!current_track) return;
            document.getElementById('trackName').textContent = current_track.name;
            document.getElementById('artistName').textContent = current_track.artists.map(a => a.name).join(', ');

            // 앨범 커버 업데이트
            const albumCover = document.getElementById('albumCover');
            if (current_track.album?.images?.[0]?.url) {
                albumCover.src = current_track.album.images[0].url;
                albumCover.style.display = 'block';
            } else {
                albumCover.style.display = 'none';
            }

            document.getElementById('trackInfo').classList.remove('hidden');
            updateMediaSession();
        }
        function updateMediaSession() {
            if (!('mediaSession' in navigator) || !current_track) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: current_track.name,
                artist: current_track.artists.map(a => a.name).join(', '),
                album: current_track.album?.name || 'Unknown Album',
                artwork: current_track.album?.images?.map(img => ({ src: img.url, sizes: `${img.width}x${img.height}`, type: 'image/jpeg' })) || []
            });
            navigator.mediaSession.setActionHandler('play', async () => { await togglePlayPause(); });
            navigator.mediaSession.setActionHandler('pause', async () => { await togglePlayPause(); });
            navigator.mediaSession.setActionHandler('previoustrack', async () => { await playPrevious(); });
            navigator.mediaSession.setActionHandler('nexttrack', async () => { await playNext(); });
            navigator.mediaSession.playbackState = is_paused ? 'paused' : 'playing';
        }
        function updatePlayPauseIcon() {
            document.getElementById('playPauseIcon').textContent = is_paused ? '▶' : '‖';
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = is_paused ? 'paused' : 'playing';
        }
        function updateIPodState() {
            const el = document.getElementById('ipodContainer');
            if (!is_paused) el.classList.add('playing'); else el.classList.remove('playing');
        }
        async function togglePlayPause() { if (player) await player.togglePlay(); }
        async function adjustVolume(delta) {
            if (!player) return;
            try {
                const state = await player.getCurrentState();
                if (state) {
                    const newV = Math.max(0, Math.min(1, state.volume + delta));
                    await player.setVolume(newV);
                    const control = delta > 0 ? document.getElementById('volumeUp') : document.getElementById('volumeDown');
                    control.classList.add('active'); setTimeout(() => control.classList.remove('active'), 200);
                }
            } catch (e) { console.error('볼륨 조절 오류:', e); }
        }

        // ===== 초기 추천 =====
        // ✅ 검색 결과에서 선택한 곡으로 시작 (track_key 기반)
        async function startRecommendationPlaylist(selectedTrack) {
            if (!selectedTrack || !selectedTrack.track_key) {
                alert('먼저 노래를 검색하고 선택해주세요.');
                return;
            }

            console.log('🎵 Starting playlist with track_key:', selectedTrack.track_key);

            try {
                const r = await fetch(`${API_BASE_URL}/recommend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        track_key: selectedTrack.track_key,
                        num_recommendations: 30
                    })
                });
                const d = await r.json();
                if (d.error) {
                    alert(d.error);
                }
                else if (d.recommendations?.length > 0) {
                    await setupInitialPlaylist(d.recommendations, selectedTrack);
                }
                else {
                    alert('추천곡을 찾을 수 없습니다. 다른 노래를 시도해보세요.');
                }
            } catch (e) {
                console.error('Initial recommendation error:', e);
                alert('추천 시스템에 연결할 수 없습니다.');
            }
        }
        async function setupInitialPlaylist(recommendations, originalSong) {
            try {
                console.log(`🎵 Setting up initial playlist with ${recommendations.length} recommendations`);

                // 기존 플레이리스트 완전히 초기화
                playlist = [];
                currentTrackIndex = 0;
                current_track = null;

                // 재생 중이면 중지
                if (player) {
                    try {
                        await player.pause();
                    } catch (e) {
                        console.warn('Failed to pause player:', e);
                    }
                }

                // 먼저 선택한 원곡의 Spotify 정보 가져오기
                let originalSpotifyTrack = null;
                if (originalSong?.track_key) {
                    try {
                        const origResponse = await fetch(`https://api.spotify.com/v1/tracks/${originalSong.track_key}`, {
                            headers: { 'Authorization': `Bearer ${access_token}` }
                        });
                        if (origResponse.ok) {
                            originalSpotifyTrack = await origResponse.json();
                        }
                    } catch (e) {
                        console.warn('Failed to fetch original track:', e);
                    }
                }

                const r = await fetch(`${API_BASE_URL}/find-spotify-tracks`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tracks: recommendations, access_token })
                });
                if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
                const d = await r.json();

                if (d.spotify_tracks?.length > 0) {
                    // 원곡을 플레이리스트 맨 앞에 추가
                    if (originalSpotifyTrack) {
                        playlist.push({
                            track_key: originalSong.track_key,
                            track: originalSong.track,
                            artist: originalSong.artist,
                            spotify_track: originalSpotifyTrack,
                            uri: originalSpotifyTrack.uri,
                            preview_url: originalSpotifyTrack.preview_url
                        });
                    }

                    // 추천곡들 추가 (원곡 제외하고 9개)
                    playlist.push(...d.spotify_tracks.slice(0, 9));

                    // ✅ track_key를 각 트랙에 저장
                    playlist.forEach((track, idx) => {
                        if (!track.track_key && recommendations[idx - 1]?.track_key) {
                            track.track_key = recommendations[idx - 1].track_key;
                        }
                    });

                    console.log(`✅ Playlist created: ${playlist.length} tracks (starting with selected track)`);
                    document.getElementById('initialSongInput').classList.add('hidden');

                    if (!player) initializeSpotifyPlayer(); else playTrackAtIndex(0);
                } else {
                    alert('Spotify에서 추천곡들을 찾을 수 없습니다. 다른 노래를 시도해보세요.');
                }
            } catch (e) {
                console.error('Error setting up playlist:', e);
                alert('플레이리스트 생성 중 오류: ' + e.message);
            }
        }

        async function searchInitialSongs() {
            const query = document.getElementById('initialSongTitle').value.trim();
            if (!query) { alert('검색어를 입력해주세요.'); return; }
            const btn = document.getElementById('initialSearchBtn');
            btn.disabled = true; btn.textContent = '검색 중...';
            try {
                const r = await fetch(`${API_BASE_URL}/search-songs`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query })
                });
                const d = await r.json();
                if (d.error) { document.getElementById('initialSearchResults').innerHTML = `<div class="error-message">${d.error}</div>`; }
                else { displayInitialSearchResults(d.results); }
            } catch (e) {
                console.error('Initial search error:', e);
                document.getElementById('initialSearchResults').innerHTML = '<div class="error-message">검색 서비스에 연결할 수 없습니다.</div>';
            } finally { btn.disabled = false; btn.textContent = '검색'; }
        }
        async function displayInitialSearchResults(results) {
            const div = document.getElementById('initialSearchResults');
            if (results.length === 0) {
                div.innerHTML = '<div class="error-message">검색 결과가 없습니다.</div>';
                return;
            }

            // 먼저 결과 표시
            let html = '<div class="recommendation-list" style="max-height:200px;">';
            results.slice(0, 10).forEach((r, idx) => {
                html += `
          <div class="recommendation-item" data-track-idx="${idx}">
            <img class="rec-album-cover" data-idx="${idx}" src="" alt="">
            <div class="rec-info">
              <div class="rec-title">${r.track}</div>
              <div class="rec-artist">${r.artist} - ${r.album}</div>
            </div>
          </div>`;
            });
            html += '</div>';
            div.innerHTML = html;

            // Spotify에서 앨범 커버 가져오기 (백그라운드)
            results.slice(0, 10).forEach(async (r, idx) => {
                try {
                    const query = `track:"${r.track}" artist:"${r.artist}"`;
                    const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=1`, {
                        headers: { 'Authorization': `Bearer ${access_token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const track = data?.tracks?.items?.[0];
                        if (track?.album?.images?.[2]) {
                            const img = div.querySelector(`img[data-idx="${idx}"]`);
                            if (img) img.src = track.album.images[2].url;
                        }
                    }
                } catch (e) {
                    console.warn('Failed to fetch album cover:', e);
                }
            });

            // Attach click listeners with proper data
            results.slice(0, 10).forEach((r, idx) => {
                const elem = div.querySelector(`[data-track-idx="${idx}"]`);
                if (elem) {
                    elem.onclick = () => selectAndStartPlaylist({
                        track_key: r.track_key,
                        track: r.track,
                        artist: r.artist,
                        album: r.album
                    });
                }
            });
        }

        // ✅ 검색 결과에서 곡 선택 시 바로 재생 시작
        async function selectAndStartPlaylist(trackData) {
            console.log('Selected track:', trackData);
            console.log('Track key being passed:', trackData.track_key);
            document.getElementById('initialSearchResults').innerHTML = '';
            document.getElementById('initialSongTitle').value = `${trackData.track} - ${trackData.artist}`;

            // 바로 추천 플레이리스트 시작
            await startRecommendationPlaylist(trackData);

            // 검색창 숨기고 앨범 커버 보이기
            document.getElementById('initialSongInput').classList.add('hidden');
            const albumCover = document.querySelector('.album-cover');
            if (albumCover) albumCover.classList.remove('hidden');
        }

        // 검색창 토글
        function showSearchInterface() {
            const searchInterface = document.getElementById('initialSongInput');
            const albumCover = document.querySelector('.album-cover');

            // 토글 방식: 이미 보이면 숨기고, 숨겨져 있으면 보이기
            if (searchInterface.classList.contains('hidden')) {
                searchInterface.classList.remove('hidden');
                if (albumCover) albumCover.classList.add('hidden');
                document.getElementById('initialSongTitle').focus();
            } else {
                searchInterface.classList.add('hidden');
                if (albumCover) albumCover.classList.remove('hidden');
                document.getElementById('initialSearchResults').innerHTML = '';
                document.getElementById('initialSongTitle').value = '';
            }
        }

        // 키워드 검색
        async function searchByKeyword() {
            const keyword = document.getElementById('keywordSearchInput').value.trim();
            if (!keyword) { alert('키워드를 입력해주세요.'); return; }

            const btn = document.getElementById('keywordSearchBtn');
            btn.disabled = true;
            btn.textContent = '검색 중...';

            try {
                const response = await fetch(`${API_BASE_URL}/search-by-keyword`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, top_k: 200 })
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                // 결과를 songs 테이블에서 조회하여 메타데이터 가져오기
                await displayKeywordSearchResults(data.results);

            } catch (e) {
                console.error('Keyword search error:', e);
                alert('키워드 검색 중 오류가 발생했습니다.');
            } finally {
                btn.disabled = false;
                btn.textContent = '검색';
            }
        }

        // 키워드 검색 결과 표시
        async function displayKeywordSearchResults(results) {
            const div = document.getElementById('keywordSearchResults');

            if (results.length === 0) {
                div.innerHTML = '<div class="error-message">검색 결과가 없습니다.</div>';
                return;
            }

            // 먼저 결과 표시
            let html = '<div class="recommendation-list" style="max-height:200px;">';
            results.forEach((r, idx) => {
                html += `
          <div class="recommendation-item" data-track-idx="${idx}">
            <img class="rec-album-cover" data-idx="${idx}" src="" alt="">
            <div class="rec-info">
              <div class="rec-title">로딩 중...</div>
              <div class="rec-artist">...</div>
            </div>
          </div>`;
            });
            html += '</div>';
            div.innerHTML = html;

            // Spotify에서 트랙 정보 가져오기
            for (let idx = 0; idx < results.length; idx++) {
                const r = results[idx];
                try {
                    const response = await fetch(`https://api.spotify.com/v1/tracks/${r.track_key}`, {
                        headers: { 'Authorization': `Bearer ${access_token}` }
                    });

                    if (response.ok) {
                        const track = await response.json();

                        // UI 업데이트
                        const item = div.querySelector(`[data-track-idx="${idx}"]`);
                        if (item) {
                            const titleElem = item.querySelector('.rec-title');
                            const artistElem = item.querySelector('.rec-artist');
                            const imgElem = item.querySelector('.rec-album-cover');

                            titleElem.textContent = track.name;
                            artistElem.textContent = `${track.artists[0].name} - ${track.album.name}`;

                            if (track.album?.images?.[2]) {
                                imgElem.src = track.album.images[2].url;
                            }

                            // 클릭 이벤트
                            item.onclick = () => selectAndStartPlaylist({
                                track_key: r.track_key,
                                track: track.name,
                                artist: track.artists[0].name,
                                album: track.album.name
                            });
                        }
                    }
                } catch (e) {
                    console.warn(`Failed to fetch track ${r.track_key}:`, e);
                }
            }
        }

        // ===== Controls =====
        document.getElementById('centerButton').addEventListener('click', async () => { await togglePlayPause(); });
        document.getElementById('nextBtn').addEventListener('click', async () => { await playNext(); });
        document.getElementById('prevBtn').addEventListener('click', async () => { await playPrevious(); });
        document.getElementById('volumeUp').addEventListener('click', () => adjustVolume(0.1));
        document.getElementById('volumeDown').addEventListener('click', () => adjustVolume(-0.1));

        // 엔터로 검색
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('initialSongTitle').addEventListener('keypress', e => {
                if (e.key === 'Enter') searchInitialSongs();
            });
            document.getElementById('keywordSearchInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') searchByKeyword();
            });

            // 검색창 바깥쪽 클릭 시 검색창 닫기
            document.addEventListener('click', (e) => {
                const searchInterface = document.getElementById('initialSongInput');
                const searchButton = document.querySelector('button[onclick="showSearchInterface()"]');
                const trackInfo = document.getElementById('trackInfo');

                // 검색창이 열려있고, 클릭한 곳이 검색창 내부가 아니고, 검색 버튼도 아니고, track-info도 아니면
                if (!searchInterface.classList.contains('hidden') &&
                    !searchInterface.contains(e.target) &&
                    !trackInfo.contains(e.target) &&
                    e.target !== searchButton) {
                    searchInterface.classList.add('hidden');
                    const albumCover = document.querySelector('.album-cover');
                    if (albumCover) albumCover.classList.remove('hidden');
                }
            });
        });

        // 디버그
        function showPlaylistStatus() {
            if (playlist.length === 0) { console.log('🚫 No playlist loaded'); return; }
            console.log(`\n📊 ===== PLAYLIST STATUS =====`);
            console.log(`📍 Position: ${currentTrackIndex + 1}/${playlist.length}`);
            console.log(`🎵 Current: ${current_track?.name || 'None'} - ${current_track?.artists?.map(a => a.name).join(', ') || 'Unknown'}`);
            console.log(`📋 Remaining: ${playlist.length - currentTrackIndex - 1}`);
            console.log(`============================\n`);
        }
        window.showPlaylistStatus = showPlaylistStatus;

        // ===== 배경 비주얼 =====
        function createStars() {
            const box = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const s = document.createElement('div'); s.className = 'star';
                const sizes = ['small', 'medium', 'large']; s.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);
                s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 2 + 's'; s.style.animationDuration = (1 + Math.random() * 2) + 's';
                box.appendChild(s);
            }
        }
        function createDust() {
            const d = document.createElement('div'); d.className = 'dust';
            d.style.left = Math.random() * 100 + '%'; d.style.width = d.style.height = Math.random() * 3 + 1 + 'px';
            d.style.animationDuration = (8 + Math.random() * 4) + 's'; d.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(d); setTimeout(() => d.remove(), 12000);
        }

        // ===== ✅ 아이팟 드래그 =====
        (function enableIPodDrag() {
            const wrap = document.getElementById('ipodWrapper');
            let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

            function onDown(e) {
                dragging = true; wrap.classList.add('dragging');
                const rect = wrap.getBoundingClientRect();
                startLeft = rect.left; startTop = rect.top;
                if (e.touches && e.touches[0]) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }
                else { startX = e.clientX; startY = e.clientY; }
                e.preventDefault();
            }
            function onMove(e) {
                if (!dragging) return;
                const x = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
                const y = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
                const dx = x - startX; const dy = y - startY;
                let left = startLeft + dx; let top = startTop + dy;

                // 화면 밖으로 못나가게 클램프
                const W = window.innerWidth, H = window.innerHeight;
                const w = wrap.offsetWidth, h = wrap.offsetHeight;
                left = Math.max(0, Math.min(W - w, left));
                top = Math.max(0, Math.min(H - h, top));

                wrap.style.left = left + 'px';
                wrap.style.top = top + 'px';
            }
            function onUp() {
                dragging = false; wrap.classList.remove('dragging');
            }

            wrap.addEventListener('mousedown', onDown);
            wrap.addEventListener('touchstart', onDown, { passive: false });
            window.addEventListener('mousemove', onMove, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchend', onUp);
        })();

        // ===== 초기화 =====
        createStars(); setInterval(createDust, 2000); initializeAuth();
    </script>
</body>
